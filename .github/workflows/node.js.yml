name: Next.js CI/CD
on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    runs-on: self-hosted  # using your self-hosted GitHub runner

    strategy:
      matrix:
        node-version: [20.x] # recommended for Next.js 14+
        
    steps:
      #  Checkout your repo
      - name: Checkout repository
        uses: actions/checkout@v4

      #  Setup Node.js
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
         # cache: 'npm'
         # cache-dependency-path: package-lock.json

      # Create .env file dynamically from GitHub Secrets
      - name: Create environment file
        run: |
          echo "Creating .env file..."
          cat <<EOF > .env
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          #PORT=${{ secrets.PORT }}
          GITHUB_ID=${{ secrets.GITHUB_ID }}
          GITHUB_SECRET=${{ secrets.GITHUB_SECRET }}
          NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          EOF
          echo "✅ .env file created successfully"
          echo "----------------------------------"

      # Install dependencies
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      #  Build Next.js app
      - name: Build Next.js app
        run: |
          export NEXT_TELEMETRY_DISABLED=1
          npm run build

      # Restart Next.js app using PM2
      - name: Restart Next.js with PM2
        run: |
          pm2 restart iiid-website
          pm2 save
          echo "✅ Next.js app restarted successfully"