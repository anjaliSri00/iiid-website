name: Deploy to Vercel

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Debug - Show Node version
        run: node --version
      
      - name: Debug - Show npm version
        run: npm --version
      
      - name: Debug - Show directory contents
        run: ls -la
      
      - name: Debug - Show package.json
        run: cat package.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Debug - Check if Next.js is installed
        run: npx next --version
      
      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Debug - Check if build folder exists
        run: ls -la .next || echo "Build folder not found"
      
      - name: Install Vercel CLI
        run: npm install --global vercel
      
      - name: Deploy to Vercel
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
